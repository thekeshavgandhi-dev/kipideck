<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kipideck</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" />
        <span class="brand-name">Kipideck</span>
        <span class="brand-count" id="itemCount">0 saved</span>
      </div>
      <button id="openLibraryBtn" class="icon-btn" title="Open full library">⤢</button>
    </header>

    <section class="actions">
      <button id="savePageBtn" class="primary-btn">
        <span class="primary-ico">📌</span>
        <span id="savePageLabel">Save this page</span>
        <span class="kbd-hint"><kbd>Space</kbd><kbd>K</kbd></span>
      </button>
      <div class="tabs-row">
        <button id="saveTabsBtn" class="secondary-btn" title="Save every open tab in this window as one searchable session">
          <span class="secondary-ico">📑</span>
          Save all tabs
        </button>
        <select id="tabsDeckSelect" class="deck-select" title="Which deck the session goes to"></select>
      </div>
      <div class="hint">
        Right-click anything on a page → <strong>Save to Kipi</strong> ·
        selected text saves itself
      </div>
      <div class="hint setup-row" id="setupRow" hidden>
        <a href="#" id="setupLink">Finish setup — choose what Kipideck may capture →</a>
      </div>
    </section>

    <div class="note-row">
      <input id="noteInput" type="text" placeholder="Quick note — press Enter to save" />
    </div>

    <div class="search-row" id="searchRow" hidden>
      <span class="search-ico">🔍</span>
      <input id="searchInput" type="search" placeholder="Search your Kipideck…" />
    </div>

    <main id="itemsList" class="items-list">
      <div class="empty-state" id="emptyState">
        <div class="empty-emoji">📌</div>
        <p class="empty-title">Nothing saved yet</p>
        <p class="empty-sub">
          Right-click any page, link or image → <strong>Save to Kipi</strong>.<br />
          Or just highlight some text — it saves itself.
        </p>
      </div>
    </main>

    <footer class="footer">
      <a href="#" id="openLibraryLink">Open full library →</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
