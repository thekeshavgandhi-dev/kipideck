<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kipideck Library</title>
<link rel="icon" href="../icons/icon32.png" />
<link rel="stylesheet" href="library.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo-row">
      <img src="../icons/icon32.png" alt="" />
      <span>Kipideck</span>
    </div>

    <button id="newDeckBtn" class="new-deck-btn">+ New deck</button>

    <div class="nav-section">
      <div class="nav-item active" data-deck="all">
        <span class="nav-ico">🗂️</span><span class="nav-label">All items</span><span class="nav-count" id="countAll"></span>
      </div>
      <div class="nav-item" data-deck="pinned">
        <span class="nav-ico">📍</span><span class="nav-label">Pinned</span><span class="nav-count" id="countPinned"></span>
      </div>
    </div>

    <div class="nav-section-title">Decks</div>
    <div id="deckList" class="nav-section"></div>

    <div class="nav-section-title">Tags</div>
    <div id="tagCloud" class="tag-cloud"></div>

    <div class="sidebar-footer">
      <button id="exportBtn" class="ghost-link">⬇ Export</button>
      <button id="importBtn" class="ghost-link">⬆ Import</button>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button id="settingsBtn" class="ghost-link">⚙ Settings</button>
    </div>
  </aside>

  <main class="content">
    <header class="content-header">
      <h1 id="viewTitle">All items</h1>
      <div class="header-actions">
        <input id="searchInput" type="search" placeholder="Search title, text, tags, domain…" />
        <select id="sortSelect">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">Title A–Z</option>
        </select>
        <div class="view-toggle">
          <button id="gridViewBtn" class="active" title="Grid view">▦</button>
          <button id="listViewBtn" title="List view">☰</button>
        </div>
      </div>
    </header>

    <div id="bulkBar" class="bulk-bar hidden">
      <span id="bulkCount"></span>
      <select id="bulkMoveSelect"><option value="">Move to deck…</option></select>
      <button id="bulkDeleteBtn" class="danger-btn">Delete selected</button>
      <button id="bulkClearBtn" class="ghost-link">Clear selection</button>
    </div>

    <div id="itemsGrid" class="items-grid"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-emoji">📭</div>
      <h3>Nothing here yet</h3>
      <p>Right-click any page, link, image, or selected text and choose <strong>Save to Kipi</strong> — it'll show up here, auto-sorted.</p>
    </div>
  </main>
</div>

<!-- Item detail / edit modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <button id="modalClose" class="modal-close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- New deck modal -->
<div id="deckModalOverlay" class="modal-overlay hidden">
  <div class="modal small">
    <button id="deckModalClose" class="modal-close">✕</button>
    <h3>New deck</h3>
    <div class="form-row">
      <label>Icon</label>
      <input id="deckIconInput" maxlength="2" value="🗂️" />
    </div>
    <div class="form-row">
      <label>Name</label>
      <input id="deckNameInput" placeholder="e.g. Recipes" />
    </div>
    <div class="form-row">
      <label>Color</label>
      <input id="deckColorInput" type="color" value="#7c5cfc" />
    </div>
    <button id="deckSaveBtn" class="primary-btn">Create deck</button>
  </div>
</div>

<!-- Settings modal -->
<div id="settingsModalOverlay" class="modal-overlay hidden">
  <div class="modal small">
    <button id="settingsModalClose" class="modal-close">✕</button>
    <h3>Settings</h3>
    <label class="switch-row">
      <input type="checkbox" id="autoOrganizeToggle" />
      <span>Auto-organize into decks &amp; tags</span>
    </label>
    <label class="switch-row">
      <input type="checkbox" id="toastToggle" />
      <span>Show save confirmation toast</span>
    </label>
    <label class="switch-row">
      <input type="checkbox" id="floatBtnToggle" />
      <span>Show "Save to Kipi" bubble on text selection</span>
    </label>
    <hr />
    <button id="clearAllBtn" class="danger-btn">Delete all items &amp; reset decks</button>
  </div>
</div>

<script type="module" src="library.js"></script>
</body>
</html>
