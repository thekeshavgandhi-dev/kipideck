name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scale_items:
        description: "Item count for the scale benchmark (0 = skip)"
        required: false
        default: "0"
  schedule:
    # Monday 03:00 UTC — the 50k-item benchmark is too slow for every push.
    - cron: "0 3 * * 1"

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The extension itself ships with zero runtime dependencies; this installs
      # the test harness only (fake-indexeddb).
      - run: npm ci

      - name: Unit + wiring tests
        run: npm test

  scale:
    name: Scale benchmark
    runs-on: ubuntu-latest
    # Nightly, or on demand with an item count. Skipped for ordinary pushes.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.scale_items != '0')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run benchmark
        env:
          ITEMS: ${{ github.event.inputs.scale_items || '50000' }}
        run: npm run test:scale
        # The 50k run takes minutes; give it room rather than letting the
        # default 6-hour job hide a hang.
        timeout-minutes: 30

  website:
    name: Website build + extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      # `prebuild` packages the extension zips first and fails if any file the
      # manifest or a runtime.getURL() call needs is missing from the package.
      - name: Build site (also packages the extension)
        run: npm run build
        working-directory: website

      # Re-checks the zips that just got built against the store rules
      # (description length, background.scripts under MV3, unrecognized keys…).
      # The packager only validates the source; this validates the artifact that
      # would actually be uploaded.
      - name: Verify the store packages
        run: npm run verify-extension
        working-directory: website
